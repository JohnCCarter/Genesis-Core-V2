name: CI (V2)

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - "archive/**"
      - "Archive/**"
    paths-ignore:
      - "artifacts/**"
      - "cache/**"
      - "data/**"
      - "logs/**"
      - "results/**"
      - "tmp/**"
  pull_request:
    branches-ignore:
      - "archive/**"
      - "Archive/**"
    paths-ignore:
      - "artifacts/**"
      - "cache/**"
      - "data/**"
      - "logs/**"
      - "results/**"
      - "tmp/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,mcp]" || (
            echo "[CI-V2] pip install failed; purging pip cache and retrying once..." &&
            python -m pip cache purge &&
            python -m pip install -e ".[dev,mcp]"
          )

      - name: Fetch base branch (PR only)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.base_ref }}

      - name: Run pre-commit hygiene
        run: pre-commit run --all-files

      - name: Run pytest baseline
        run: pytest -q

      - name: Run smoke suite
        run: python scripts/smoke/smoke_suite.py
