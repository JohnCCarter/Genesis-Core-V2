name: CI (V2)

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - "archive/**"
      - "Archive/**"
    paths-ignore:
      - "artifacts/**"
      - "cache/**"
      - "data/**"
      - "logs/**"
      - "results/**"
      - "tmp/**"
  pull_request:
    branches-ignore:
      - "archive/**"
      - "Archive/**"
    paths-ignore:
      - "artifacts/**"
      - "cache/**"
      - "data/**"
      - "logs/**"
      - "results/**"
      - "tmp/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra mcp --locked

      - name: Fetch base branch (PR only)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.base_ref }}

      - name: Run pre-commit hygiene
        run: uv run pre-commit run --all-files

      - name: Run dependency audit
        run: uv run python scripts/audit/pip_audit.py

      - name: Run pytest baseline
        run: uv run pytest -q

      - name: Run smoke suite
        run: uv run python scripts/smoke/smoke_suite.py
