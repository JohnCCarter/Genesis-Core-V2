name: Dependabot auto-merge

# Auto-merges low-risk Dependabot PRs (patch bumps + GitHub Actions) once the
# required status checks pass. Branch protection still gates the merge, so a
# breaking bump that fails CI is never merged. Minor/major bumps of runtime/dev
# deps are intentionally left for manual review.
#
# Uses pull_request_target (needs write token to enable auto-merge) but never
# checks out the PR's code — only trusted metadata + the gh CLI run — so there is
# no untrusted code execution.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for low-risk updates
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' ||
              contains(steps.meta.outputs.package-ecosystem, 'github') }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
