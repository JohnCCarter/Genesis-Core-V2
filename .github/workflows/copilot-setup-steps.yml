name: Copilot Setup Steps

# Pre-warms the Copilot coding agent's ephemeral environment so it starts with
# the same toolchain as CI (uv + Python 3.11 + synced dev/mcp deps) and can run
# ruff / black / pytest / pre-commit immediately. The job name MUST be
# `copilot-setup-steps` for the agent to pick it up.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (uv sync, locked)
        run: uv sync --extra dev --extra mcp --locked
