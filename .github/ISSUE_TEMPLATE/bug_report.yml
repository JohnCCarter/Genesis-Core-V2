name: Bug report
description: Report a reproducible problem in Genesis-Core-V2.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What slice or surface is affected, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide deterministic steps, commands, or inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste logs, test failures, screenshots, or other supporting artifacts.
    validations:
      required: false
